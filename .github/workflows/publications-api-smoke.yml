name: Publications API smoke test

on:
  push:
    branches:
      - phase2/content-items-publishing
    paths:
      - ".github/workflows/publications-api-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate deployed publications API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = new URL("https://jzceajrfqtrdemptlfbp.supabase.co/functions/v1/publications-v1");
          endpoint.searchParams.set("channel", "linkedin");
          endpoint.searchParams.set("portfolio", "true");
          endpoint.searchParams.set("limit", "3");

          const response = await fetch(endpoint, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(10_000),
          });

          if (!response.ok) {
            throw new Error(`API returned ${response.status}: ${await response.text()}`);
          }

          const payload = await response.json();

          if (payload.version !== "1") {
            throw new Error(`Unexpected version: ${payload.version}`);
          }

          if (!Array.isArray(payload.publications) || payload.publications.length !== 3) {
            throw new Error("Expected exactly 3 publications");
          }

          const [first, second, third] = payload.publications;

          if (first.channel !== "linkedin" || second.channel !== "linkedin" || third.channel !== "linkedin") {
            throw new Error("Expected only LinkedIn publications");
          }

          if (first.title !== "The requirements phase is over.") {
            throw new Error(`Unexpected newest publication: ${first.title}`);
          }

          const dates = payload.publications.map((item) => Date.parse(item.publishedAt));
          if (dates.some(Number.isNaN) || !(dates[0] > dates[1] && dates[1] > dates[2])) {
            throw new Error("Publications are not newest-first");
          }

          console.log(JSON.stringify(payload, null, 2));
          NODE

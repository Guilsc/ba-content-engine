name: Web CI

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/web-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Commit dependency lockfile when generated
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git ls-files --others --exclude-standard package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock Curatia web dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
          CURATIA_BOOTSTRAP_OWNER_EMAIL: owner@example.com
        run: npm run build
